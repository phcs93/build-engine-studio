<link rel="stylesheet" href="art-editor.css">
<script src="art-editor.js"></script>

<template id="art-editor">

    <div class="flex-rows">

        <div class="flex-columns padding-medium flex-gap-medium top-bar">

            <label>PALETTE</label>
            <select class="palette-select">
                <option value="blood">Blood</option>
                <option value="duke-nukem-3d" selected>Duke Nukem 3D</option>
                <option value="exhumed-powerslave">Exhumed PowerSlave</option>
                <option value="ion-fury">Ion Fury</option>
                <option value="nam">NAM</option>
                <option value="redneck-rampage">Redneck Rampage</option>
                <option value="shadow-warrior">Shadow Warrior</option>
                <option value="ww2gi">WW2GI</option>
            </select>
            
        </div>

        <div class="grid">

        </div>

        <div class="flex-columns padding-medium flex-gap-medium bottom-bar">

            <div class="flex-columns flex-gap-small">
                <label>SIZE</label>
                <input type="range" class="grid-size-range" min="8" max="512" step="2" value="128">
                <label class="grid-size-label">128 px</label>
            </div>

            <label>
                <input type="checkbox" class="transparency" checked>
                <span>TRANSPARENCY</span>
            </label>

            <label>
                <input type="checkbox" class="background">
                <span>BACKGROUND</span>
            </label>  

        </div>

    </div>

</template>
