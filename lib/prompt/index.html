<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <script src="index.js"></script>    
    </head>
    <body>
        <div class="flex-grow">
            <form id="prompt-form">
                <div class="flex-rows flex-gap-medium padding-medium">
                    <label id="prompt-message"></label>
                    <input type="text" name="value" id="prompt-value">    
                    <div class="flex-columns flex-gap-medium flex-justify-content-end">
                        <button type="submit">OK</button>
                        <button type="button" id="prompt-cancel">Cancel</button>                    
                    </div>
                </div>
            </form>
        </div>
    </body>
</html>
